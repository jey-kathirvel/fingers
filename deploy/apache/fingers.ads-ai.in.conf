<VirtualHost *:80>
    ServerName fingers.ads-ai.in
    Redirect permanent / https://fingers.ads-ai.in/
</VirtualHost>

<VirtualHost *:443>
    ServerName fingers.ads-ai.in

    SSLEngine on
    # Certbot will manage certificate paths after issuance:
    # SSLCertificateFile /etc/letsencrypt/live/fingers.ads-ai.in/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/fingers.ads-ai.in/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass /api http://127.0.0.1:8090/api
    ProxyPassReverse /api http://127.0.0.1:8090/api

    ProxyPass /docs http://127.0.0.1:8090/docs
    ProxyPassReverse /docs http://127.0.0.1:8090/docs
    ProxyPass /openapi.json http://127.0.0.1:8090/openapi.json
    ProxyPassReverse /openapi.json http://127.0.0.1:8090/openapi.json

    ProxyPass / http://127.0.0.1:3090/
    ProxyPassReverse / http://127.0.0.1:3090/

    ErrorLog ${APACHE_LOG_DIR}/fingers-error.log
    CustomLog ${APACHE_LOG_DIR}/fingers-access.log combined
</VirtualHost>
